# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploys Cupid's Corner as a single web service (Express serves both the
# API and the built React client on one port), with a persistent disk so
# accounts, messages and photos survive restarts and deploys. Persistent
# disks need a paid instance (starter or higher).

services:
  - type: web
    name: cupids-corner
    runtime: node
    plan: starter
    branch: main
    # --include=dev: with NODE_ENV=production npm skips devDependencies,
    # and the client build needs Vite from them.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      # Data on the persistent disk below.
      - key: DB_PATH
        value: /var/data/data.sqlite
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: VERIFICATIONS_DIR
        value: /var/data/verifications
      # Postgres (e.g. a Supabase project's connection string). Optional:
      # unset = SQLite at DB_PATH. Before setting it on a live site, copy the
      # data across once: `npm run copy:sqlite-to-postgres` (see README).
      - key: DATABASE_URL
        sync: false
      # Usernames that can review verifications and reports (comma-separated).
      - key: ADMIN_USERNAMES
        sync: false
      # Shown in the Terms, Privacy Policy and Community Guidelines.
      - key: SUPPORT_EMAIL
        sync: false
      # Stream (chat + video) — optional, app runs without it.
      - key: STREAM_API_KEY
        sync: false
      - key: STREAM_API_SECRET
        sync: false
      # Stripe (buy sparks) — optional, app runs without it.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Google Play Billing (buy sparks in the Android app) — optional.
      # See server/playBilling.js.
      - key: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_PLAY_PACKAGE_NAME
        sync: false
      # Cupid AI — optional, ships with a heuristic fallback.
      - key: CUPID_LLM_URL
        sync: false
      - key: CUPID_LLM_KEY
        sync: false
      - key: CUPID_LLM_MODEL
        sync: false
      # Paid voice sessions with Cupid (see server/coach.js). Off until
      # COACH_PHONE_NUMBER is set. The number is only ever shown to members
      # who have paid; COACH_AGENT_SECRET lets the voice agent check codes.
      - key: COACH_PHONE_NUMBER
        sync: false
      - key: COACH_AGENT_SECRET
        sync: false
      - key: COACH_SESSION_SPARKS
        value: 1200
      - key: COACH_SESSION_MINUTES
        value: 20
      # x402 paid endpoint (POST /match/compatibility). Disabled until
      # X402_PAY_TO is set. CDP keys are required for Bazaar listing.
      - key: X402_PAY_TO
        sync: false
      - key: X402_PUBLIC_URL
        sync: false
      - key: X402_NETWORK
        value: eip155:8453
      - key: X402_PRICE
        value: "$0.001"
      - key: CDP_API_KEY_ID
        sync: false
      - key: CDP_API_KEY_SECRET
        sync: false

    disk:
      name: cupids-corner-data
      mountPath: /var/data
      sizeGB: 1
