# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploys Cupid's Corner as a single web service (Express serves both the
# API and the built React client on one port), with a persistent disk so
# accounts, messages and photos survive restarts and deploys. Persistent
# disks need a paid instance (starter or higher).

services:
  - type: web
    name: cupids-corner
    runtime: node
    plan: starter
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      # Data on the persistent disk below.
      - key: DB_PATH
        value: /var/data/data.sqlite
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: VERIFICATIONS_DIR
        value: /var/data/verifications
      # Usernames that can review verifications and reports (comma-separated).
      - key: ADMIN_USERNAMES
        sync: false
      # Shown in the Terms, Privacy Policy and Community Guidelines.
      - key: SUPPORT_EMAIL
        sync: false
      # Stream (chat + video) — optional, app runs without it.
      - key: STREAM_API_KEY
        sync: false
      - key: STREAM_API_SECRET
        sync: false
      # Stripe (buy sparks) — optional, app runs without it.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Cupid AI — optional, ships with a heuristic fallback.
      - key: CUPID_LLM_URL
        sync: false
      - key: CUPID_LLM_KEY
        sync: false
      - key: CUPID_LLM_MODEL
        sync: false
      # x402 paid endpoint (POST /match/compatibility). Disabled until
      # X402_PAY_TO is set. CDP keys are required for Bazaar listing.
      - key: X402_PAY_TO
        sync: false
      - key: X402_PUBLIC_URL
        sync: false
      - key: X402_NETWORK
        value: eip155:8453
      - key: X402_PRICE
        value: "$0.001"
      - key: CDP_API_KEY_ID
        sync: false
      - key: CDP_API_KEY_SECRET
        sync: false

    disk:
      name: cupids-corner-data
      mountPath: /var/data
      sizeGB: 1
